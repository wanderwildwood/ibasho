// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    ext {
        about_version = '15.0.4'
        kotlin_version = '2.3.10'
        room_version = '2.8.4'
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:$kotlin_version"
        classpath "androidx.room:androidx.room.gradle.plugin:$room_version"
    }
}

plugins {
    id "com.mikepenz.aboutlibraries.plugin.android" version "${about_version}" apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
