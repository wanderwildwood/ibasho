plugins {
    id 'com.android.application'
    id "org.jetbrains.kotlin.plugin.compose"
    id 'com.mikepenz.aboutlibraries.plugin.android'

    // https://kotlinlang.org/docs/ksp-quickstart.html
    id 'com.google.devtools.ksp' version '2.3.6'
    id 'androidx.room'
    id 'kotlin-parcelize'
}

android {
    compileSdk 37
    namespace 'com.wanderwildwood.ibasho'
    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE.md', 'META-INF/NOTICE.md', 'META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }

    lint {
        baseline = file("lint-baseline.xml")
        lintOptions {
            // There may be extra translations (strings in other languages that don't exist
            // in strings.xml anymore) temporarily, until Weblate automatically deletes them.
            disable 'ExtraTranslation'
            disable 'MissingTranslation'
        }
    }

    defaultConfig {
        applicationId "com.wanderwildwood.ibasho"
        minSdkVersion 24
        // TODO: raise targetSdk again.
        // We supported targetSdk 34 until BluetoothCommand was added, which requires max 32 to work:
        // https://developer.android.com/reference/android/bluetooth/BluetoothAdapter#enable()
        // We should implement becoming a Device Owner, and then raise the targetSdk again.
        // https://gitlab.com/Nulide/findmydevice/-/issues/220
        // noinspection ExpiredTargetSdkVersion
        targetSdkVersion 32
        // Own versioning from here; upstream was at 0.16.2 when this forked.
        versionCode 48
        versionName "0.1.47"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Upstream carried three release channels; this fork has one.
        // The server URL is deliberately empty: a self-hosted app should not
        // point its users at somebody else's server by default.
        buildConfigField "String", "DEFAULT_FMD_COMMAND", "\"fmd\""
        buildConfigField "String", "DEFAULT_FMD_SERVER_URL", "\"\""
    }

    // A real keystore in signing/ signs every build type when it is present, so the
    // very first install is already release-signed and a later update can never hit
    // INSTALL_FAILED_UPDATE_INCOMPATIBLE. It is gitignored, and there is no fallback:
    // a fresh clone builds an unsigned release APK, which will not install anywhere.
    // A keystore committed to a public repo is not a signing key, it is a formality,
    // and a missing one should stop you rather than produce something installable.
    def signingPropertiesFile = rootProject.file("signing/signing.properties")
    def realSigningConfig = null
    if (signingPropertiesFile.isFile()) {
        def signingProperties = new Properties()
        signingPropertiesFile.withInputStream { signingProperties.load(it) }
        realSigningConfig = signingConfigs.create("real") {
            storeFile rootProject.file("signing/signing.keystore")
            storePassword signingProperties.getProperty("STORE_PASSWORD")
            keyAlias signingProperties.getProperty("KEY_ALIAS")
            keyPassword signingProperties.getProperty("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            // Release APKs carry arm64-v8a only: every device this app is for is arm64. Debug builds keep the emulator's.
            ndk { abiFilters "arm64-v8a" }
            signingConfig realSigningConfig
            // WARNING: Compile and test the release flavor before publishing!!!
            // This is because minification may strip things that are not explicitly referenced
            // but are actually needed (e.g., objects being serialised by Gson).
            // https://stackoverflow.com/questions/35853593/minify-android-app-but-do-not-obfuscate-it
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig realSigningConfig
            // don't minify (for faster builds)
            minifyEnabled false
        }
    }

    // https://developer.android.com/guide/topics/resources/app-languages
    androidResources {
        generateLocaleConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlin {
        jvmToolchain(21)
    }

    buildFeatures {
        buildConfig true
        compose true
        viewBinding true
    }
}

// These dependencies have conflicting versions of tink.
// Thus force it to "tink-android:1.20.0" globally for the entire build.
// org.unifiedpush.android:connector:3.3.2 --> com.google.crypto.tink:tink:1.20.0
// androidx.security:security-crypto-ktx:1.1.0 --> com.google.crypto.tink:tink-android:1.8.0
configurations.configureEach {
    def tink = "com.google.crypto.tink:tink-android:1.20.0"
    resolutionStrategy {
        force(tink)
        dependencySubstitution {
            substitute module('com.google.crypto.tink:tink') using module(tink)
        }
    }
}

dependencies {
    // Mudita's E Ink component library, which themes the Compose half of this app
    implementation 'com.mudita:MMD:1.0.2'

    // AndroidX
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.annotation:annotation:1.10.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.concurrent:concurrent-futures-ktx:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation "androidx.fragment:fragment-ktx:1.9.0"
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation "androidx.work:work-runtime-ktx:2.11.2"
    implementation 'androidx.security:security-crypto-ktx:1.1.0'

    // Lifecycle
    def lifecycle_version = "2.11.0"
    implementation "androidx.lifecycle:lifecycle-process:${lifecycle_version}"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:${lifecycle_version}"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:${lifecycle_version}"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:${lifecycle_version}"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:${lifecycle_version}"

    // Room
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    // Compose
    def composeBom = platform('androidx.compose:compose-bom:2026.09.00')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.runtime:runtime-livedata'
    // Android Studio previews
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'

    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.google.code.gson:gson:2.14.0'

    // Networking
    implementation "com.squareup.okhttp3:okhttp:5.5.0"
    implementation "com.squareup.retrofit2:retrofit:3.0.0"
    implementation "com.squareup.retrofit2:converter-gson:3.0.0"
    debugImplementation("com.squareup.okhttp3:logging-interceptor:5.5.0")

    implementation 'org.unifiedpush.android:connector:3.3.5'
    implementation 'com.jakewharton:process-phoenix:3.0.0'
    implementation 'net.lingala.zip4j:zip4j:2.11.6'
    implementation "org.apache.maven:maven-artifact:3.9.16" // for semantic versions
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'

    // Shizuku
    implementation "dev.rikka.shizuku:api:13.1.0"
    implementation "dev.rikka.shizuku:provider:13.1.0"

    // com.google.crypto.tink uses javax.annotation.concurrent.GuardedBy
    // Without this dependency providing GuardedBy, R8 complains when minifying.
    implementation 'com.github.spotbugs:spotbugs-annotations:4.10.3'
}

// Despite what the docs say, both options appear to be required for the schema export to work.
// https://developer.android.com/jetpack/androidx/releases/room#compiler-options
ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
}
room {
    schemaDirectory "$projectDir/schemas"
}


// The Licenses page lists what the build actually packs: this plugin walks each variant's runtime
// dependencies and writes res/raw/aboutlibraries.json (one entry per artifact, with its POM's
// licence). What Gradle cannot see (fonts, data sets, native code, desugaring) and licence texts
// of our own choosing are in config/libraries and config/licenses. Offline: the build fetches
// nothing; the full texts come from res/raw and config/licenses. The app reads the file with
// shared-licences' LicencesJson.kt (no AboutLibraries runtime library).
aboutLibraries {
    // getCollect() etc., not collect { }: Groovy reads that as its own Object.collect.
    offlineMode.set(true)
    getCollect().configPath.set(rootProject.file("config"))
    getCollect().fetchRemoteLicense.set(false)
    getCollect().fetchRemoteFunding.set(false)
    getCollect().includePlatform.set(false)
    getExport().excludeFields.addAll("funding")
    getLibrary().mergePlatformArtifacts.set(true)
    // Debug-only artifacts (debugImplementation) are not in the release APK, so not on its page.
    getLibrary().exclusionPatterns.addAll(
        ["androidx.compose.ui:ui-tooling", "androidx.compose.ui:ui-tooling-data",
         "com.squareup.okhttp3:logging-interceptor"].collect { java.util.regex.Pattern.compile("^" + java.util.regex.Pattern.quote(it) + "\$") }
    )
}

// The build fails when a bundled library has no license, or a license with no full text to show
// (neither its own text from config/licenses nor a family text in res/raw). Mudita review, 4 Nov 2026.
def licenceRawTexts = (file("src/main/res/raw").listFiles() ?: []).collect { it.name.toLowerCase() }
tasks.matching { it.name.startsWith("prepareLibraryDefinitions") }.configureEach { t ->
    def raw = licenceRawTexts
    inputs.property("licenceRawTexts", raw) // so the check reruns when a text is added or removed
    t.doLast {
        def family = { String n ->
            def l = n.toLowerCase()
            if (l.contains("classpath")) return "classpath"
            if (l.contains("lgpl") || l.contains("lesser general")) return "lgpl"
            if (l.contains("gpl") || l.contains("general public licen")) return "gpl"
            if (l.contains("unicode")) return "unicode"
            if (l.contains("apache")) return "apache"
            if (l.contains("mpl") || l.contains("mozilla")) return "mpl"
            if (l.split(/[^a-z]+/).contains("mit")) return "mit"
            if (l.contains("bsd")) return "bsd"
            if (l.contains("ofl") || l.contains("open font")) return "ofl"
            if (l.contains("cc-by") || l.contains("cc by") || l.contains("cc0") || l.contains("public domain")) return "none"
            return null
        }
        def bad = []
        t.outputs.files.asFileTree.matching { include("**/aboutlibraries.json") }.each { f ->
            def root = new groovy.json.JsonSlurper().parse(f)
            def lics = root.licenses ?: [:]
            // A library's own license file (config/licenses, with its copyright line) stands in for
            // the bare family entry its POM names: the plugin merges config entries in, it never
            // takes one out, so a library would otherwise list "MIT" twice, once with no text.
            def hasText = { k -> lics[k]?.content ? true : false }
            def famOf = { k -> family((lics[k]?.spdxId ?: lics[k]?.name ?: k).toString()) }
            def changed = false
            (root.libraries ?: []).each { lib ->
                def keys = lib.licenses ?: []
                def own = keys.findAll { hasText(it) }.collect { famOf(it) }.findAll { it != null } as Set
                def kept = keys.findAll { hasText(it) || !(famOf(it) in own) }
                if (kept != keys) { lib.licenses = kept; changed = true }
            }
            if (changed) f.text = groovy.json.JsonOutput.toJson(root)
            (root.libraries ?: []).each { lib ->
                def keys = lib.licenses ?: []
                if (keys.isEmpty()) bad << "${lib.uniqueId}: no license"
                keys.each { k ->
                    def e = lics[k] ?: [:]
                    if (!e.content) {
                        def fam = family((e.spdxId ?: e.name ?: k).toString())
                        if (fam == null || (fam != "none" && !raw.any { it.contains(fam) })) bad << "${lib.uniqueId}: no text for ${e.name ?: k}"
                    }
                }
            }
        }
        if (bad) throw new GradleException("Licenses page: add the text in config/licenses or res/raw:\n  " + bad.unique().join("\n  "))
    }
}
